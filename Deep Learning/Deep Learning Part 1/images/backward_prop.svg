<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280">
  <rect width="760" height="280" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#1f2937">Backward Propagation</text>

  <g font-family="Arial" font-size="16" fill="#1f2937">
    <circle cx="70" cy="120" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="126" text-anchor="middle">x</text>

    <circle cx="270" cy="80" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="270" cy="160" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <circle cx="470" cy="120" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="470" y="127" text-anchor="middle">Loss</text>

    <circle cx="620" cy="120" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="620" y="127" text-anchor="middle">Update</text>
  </g>

  <g stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
        <path d="M0,0 L0,8 L8,4 z" fill="#2c3e50"/>
      </marker>
    </defs>

    <line x1="92" y1="120" x2="244" y2="80"/>
    <line x1="92" y1="120" x2="244" y2="160"/>

    <line x1="296" y1="80" x2="444" y2="120"/>
    <line x1="296" y1="160" x2="444" y2="120"/>

    <line x1="496" y1="120" x2="594" y2="120"/>
  </g>

  <g font-family="Arial" font-size="14" fill="#374151">
    <text x="120" y="100">forward</text>
    <text x="345" y="98">calculate error</text>
    <text x="510" y="104">backward</text>
  </g>
</svg>
