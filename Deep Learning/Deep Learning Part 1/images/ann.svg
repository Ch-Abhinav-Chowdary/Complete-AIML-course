    <line x1="88" y1="70" x2="232" y2="70"/>
    <line x1="88" y1="70" x2="232" y2="130"/>
    <line x1="88" y1="70" x2="232" y2="190"/>
    <line x1="88" y1="130" x2="232" y2="70"/>
    <line x1="88" y1="130" x2="232" y2="130"/>
    <line x1="88" y1="130" x2="232" y2="190"/>
