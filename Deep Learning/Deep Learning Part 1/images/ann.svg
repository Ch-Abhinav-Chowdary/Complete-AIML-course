  <g font-family="Arial" font-size="14" fill="#1f2937">
    <circle cx="70" cy="70" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="70" cy="130" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="70" cy="190" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

    <circle cx="250" cy="70" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="250" cy="130" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
