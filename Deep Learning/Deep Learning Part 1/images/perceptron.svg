  </g>

  <g stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="106" y1="90" x2="220" y2="120"/>
    <line x1="106" y1="150" x2="220" y2="150"/>
    <line x1="106" y1="210" x2="220" y2="180"/>
    <line x1="360" y1="150" x2="440" y2="150"/>
  </g>

  <g font-family="Arial" font-size="14" fill="#374151">
    <text x="148" y="82">w1</text>
    <text x="150" y="146">w2</text>
    <text x="148" y="196">w3</text>
    <text x="387" y="142">Output</text>
