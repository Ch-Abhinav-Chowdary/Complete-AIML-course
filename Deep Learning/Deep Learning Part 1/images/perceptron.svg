<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50" />
    </marker>
  </defs>

  <rect width="600" height="300" fill="#f8fafc"/>
  <text x="300" y="30" text-anchor="middle" font-size="22" font-family="Arial" fill="#1f2937" font-weight="bold">Perceptron</text>

  <g font-family="Arial" font-size="16" fill="#1f2937">
    <circle cx="80" cy="90" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="96" text-anchor="middle">x1</text>

    <circle cx="80" cy="150" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="156" text-anchor="middle">x2</text>

    <circle cx="80" cy="210" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="216" text-anchor="middle">x3</text>

    <rect x="220" y="105" width="140" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="290" y="159" text-anchor="middle" font-size="20" font-weight="bold">Neuron</text>

    <circle cx="470" cy="150" r="30" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
