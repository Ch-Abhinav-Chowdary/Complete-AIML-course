<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#f8fbff"/>
  <rect x="40" y="60" width="220" height="160" rx="18" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  <text x="150" y="120" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial" fill="#111827">Human</text>
  <text x="150" y="155" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial" fill="#374151">"I am happy"</text>
  <text x="150" y="190" text-anchor="middle" font-size="18" font-family="Segoe UI, Arial" fill="#6b7280">Natural language</text>

  <rect x="340" y="60" width="220" height="160" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="450" y="120" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial" fill="#111827">NLP</text>
  <text x="450" y="155" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial" fill="#374151">Understand + clean</text>
  <text x="450" y="190" text-anchor="middle" font-size="18" font-family="Segoe UI, Arial" fill="#6b7280">Tokenize, analyze, classify</text>

  <rect x="640" y="60" width="220" height="160" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="750" y="120" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial" fill="#111827">Machine</text>
  <text x="750" y="155" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial" fill="#374151">[1, 0, 1, 0]</text>
  <text x="750" y="190" text-anchor="middle" font-size="18" font-family="Segoe UI, Arial" fill="#6b7280">Machine-readable numbers</text>

  <path d="M260 140 L340 140" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M560 140 L640 140" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="120" y="270" width="660" height="90" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="450" y="310" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial" fill="#312e81">NLP = translating human language into machine logic</text>
  <text x="450" y="340" text-anchor="middle" font-size="18" font-family="Segoe UI, Arial" fill="#4338ca">Because computers are not mind readers. Shocking, I know.</text>
</svg>